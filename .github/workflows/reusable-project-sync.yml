name: Reusable project sync

# Keeps the roadmap project in step with the calling repository:
# - a new issue nobody is assigned to is assigned to the maintainer
# - a new issue is added with its Módulo, its Tipo (from the label) and status «Todo»;
#   issues from people without write access wait until someone adds the label «approved»
# - a pull request that closes issues («Closes #12», also across repositories) moves them to «Review»,
#   or to «In progress» while it is a draft
# - an issue closed as completed goes to «Done»; a reopened one back to «Todo»
# - when the last open issue of a Hito is closed, a project status update reports it (once per Hito)
# Only issues already in the project are moved. «Design» and «Blocked» are set by hand.
# An exhausted API rate limit is waited out (the job allows for one reset) instead of failing the run.

on:
  workflow_call:
    inputs:
      module:
        description: 'Option of the project Módulo field for this repository'
        required: true
        type: string
      project_owner:
        description: 'User that owns the project'
        required: false
        type: string
        default: 'DavidMRGaona'
      project_number:
        description: 'Project number'
        required: false
        type: number
        default: 2
      assignee:
        description: 'User assigned to new issues that nobody is assigned to'
        required: false
        type: string
        default: 'DavidMRGaona'
    secrets:
      project_token:
        description: 'Classic personal token with the project and repo scopes (GITHUB_TOKEN cannot reach user-owned projects)'
        required: false

permissions: {}

jobs:
  sync:
    name: Sync project
    runs-on: ubuntu-latest
    concurrency:
      group: project-sync-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    # Room for one wait until the rate limit resets (at most an hour)
    timeout-minutes: 90
    steps:
      # Shared by the steps below: `api` is `gh api` that waits out an exhausted rate limit.
      # The limit belongs to the token's user, so any other use of the API by that user spends it too.
      - name: Prepare the API helper
        run: |
          cat >"$RUNNER_TEMP/gh-api.sh" <<'EOF'
          # Seconds until the exhausted limit resets; a minute for a secondary limit, which has no reset time
          rate_limit_wait() {
            local now reset
            now=$(date +%s)
            reset=$(gh api rate_limit \
              --jq '[.resources.core, .resources.graphql] | map(select(.remaining == 0) | .reset) | max // empty' \
              2>/dev/null || true)
            if [[ "$reset" =~ ^[0-9]+$ ]] && [ "$reset" -gt "$now" ]; then
              echo $((reset - now + 5))
            else
              echo 60
            fi
          }

          # gh api, retried a few times when the rate limit is exhausted; any other error fails at once
          api() {
            local attempt err out wait
            err=$(mktemp)
            for attempt in 1 2 3 4; do
              if out=$(gh api "$@" 2>"$err"); then
                rm -f "$err"
                [ -z "$out" ] || printf '%s\n' "$out"
                return 0
              fi
              if [ "$attempt" = 4 ] || ! grep -qi 'rate limit' "$err"; then
                cat "$err" >&2
                rm -f "$err"
                return 1
              fi
              wait=$(rate_limit_wait)
              # stderr: stdout is the response the caller captures
              echo "::warning::GitHub API rate limit exhausted; retrying in ${wait}s" >&2
              sleep "$wait"
            done
          }
          EOF

      - name: Update the project item
        env:
          GH_TOKEN: ${{ secrets.project_token }}
          OWNER: ${{ inputs.project_owner }}
          NUMBER: ${{ inputs.project_number }}
          MODULE: ${{ inputs.module }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          ISSUE_AUTHOR: ${{ github.event.issue.author_association }}
          LABEL: ${{ github.event.label.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_ASSIGNEES: ${{ toJSON(github.event.issue.assignees.*.login) }}
          ASSIGNEE: ${{ inputs.assignee }}
          REPOSITORY: ${{ github.repository }}
          STATE_REASON: ${{ github.event.issue.state_reason }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/gh-api.sh"

          # Pull requests from forks and Dependabot get no secrets
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PROJECT_TOKEN is not available to this run; the project was not updated"
            exit 0
          fi

          PROJECT=$(api graphql -f query='
            query($owner: String!, $number: Int!) {
              user(login: $owner) {
                projectV2(number: $number) {
                  id
                  fields(first: 50) {
                    nodes { ... on ProjectV2SingleSelectField { id name options { id name } } }
                  }
                }
              }
            }' -f owner="$OWNER" -F number="$NUMBER")
          PROJECT_ID=$(jq -r '.data.user.projectV2.id' <<<"$PROJECT")

          # Idempotent: an item already in the project is returned as it is
          add_item() {
            api graphql -f query='
              mutation($project: ID!, $content: ID!) {
                addProjectV2ItemById(input: {projectId: $project, contentId: $content}) { item { id } }
              }' -f project="$PROJECT_ID" -f content="$1" --jq '.data.addProjectV2ItemById.item.id'
          }

          # The content's item in this project; empty when it is not in it
          project_item() {
            api graphql -f query='
              query($content: ID!) {
                node(id: $content) { ... on Issue { projectItems(first: 50) { nodes { id project { id } } } } }
              }' -f content="$1" \
              | jq -r --arg project "$PROJECT_ID" '.data.node.projectItems.nodes[] | select(.project.id == $project) | .id'
          }

          value_of() {
            api graphql -f query='
              query($item: ID!, $field: String!) {
                node(id: $item) {
                  ... on ProjectV2Item {
                    fieldValueByName(name: $field) { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                  }
                }
              }' -f item="$1" -f field="$2" --jq '.data.node.fieldValueByName.name // ""'
          }

          set_option() {
            local item=$1 field=$2 option=$3 field_id option_id
            field_id=$(jq -r --arg f "$field" '.data.user.projectV2.fields.nodes[] | select(.name == $f) | .id' <<<"$PROJECT")
            option_id=$(jq -r --arg f "$field" --arg o "$option" \
              '.data.user.projectV2.fields.nodes[] | select(.name == $f) | .options[] | select(.name == $o) | .id' <<<"$PROJECT")
            if [ -z "$field_id" ] || [ -z "$option_id" ]; then
              echo "::warning::The project has no option «$option» in «$field»"
              return 0
            fi
            api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project, itemId: $item, fieldId: $field, value: {singleSelectOptionId: $option}
                }) { projectV2Item { id } }
              }' -f project="$PROJECT_ID" -f item="$item" -f field="$field_id" -f option="$option_id" >/dev/null
            echo "$field → $option"
          }

          case "$EVENT" in
            issues)
              case "$ACTION" in
                closed|reopened)
                  item=$(project_item "$ISSUE_ID")
                  if [ -z "$item" ]; then
                    echo "The issue is not in the project"
                  elif [ "$ACTION" = "reopened" ]; then
                    set_option "$item" Status Todo
                  elif [ "$STATE_REASON" = "completed" ]; then
                    set_option "$item" Status Done
                  fi
                  ;;
                *)
                  if [ "$ACTION" = "opened" ] && [ "$(jq 'length' <<<"$ISSUE_ASSIGNEES")" = "0" ]; then
                    api -X POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/assignees" -f "assignees[]=$ASSIGNEE" >/dev/null
                    echo "Assigned to $ASSIGNEE"
                  fi
                  if [[ ! "$ISSUE_AUTHOR" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]] \
                    && ! jq -e 'index("approved")' <<<"$ISSUE_LABELS" >/dev/null; then
                    echo "Opened by $ISSUE_AUTHOR: waiting for the label «approved»"
                    exit 0
                  fi
                  item=$(add_item "$ISSUE_ID")
                  set_option "$item" Módulo "$MODULE"
                  # Tipo comes from the labels while it is empty; afterwards only adding «technical» changes it
                  if [ "$LABEL" = "technical" ]; then
                    set_option "$item" Tipo Technical
                  elif [ -z "$(value_of "$item" Tipo)" ]; then
                    if jq -e 'index("technical")' <<<"$ISSUE_LABELS" >/dev/null; then
                      set_option "$item" Tipo Technical
                    elif jq -e 'index("bug") or index("enhancement")' <<<"$ISSUE_LABELS" >/dev/null; then
                      set_option "$item" Tipo Functional
                    fi
                  fi
                  if [ -z "$(value_of "$item" Status)" ]; then
                    set_option "$item" Status Todo
                  fi
                  ;;
              esac
              ;;
            pull_request)
              issues=$(api graphql -f query='
                query($pr: ID!) {
                  node(id: $pr) { ... on PullRequest { closingIssuesReferences(first: 20) { nodes { id } } } }
                }' -f pr="$PR_ID" --jq '.data.node.closingIssuesReferences.nodes[].id')
              target=Review
              if [ "$PR_DRAFT" = "true" ]; then
                target="In progress"
              fi
              for issue in $issues; do
                item=$(project_item "$issue")
                if [ -z "$item" ]; then
                  continue
                fi
                # Never back from Done, nor from Review to In progress when a reviewed pull request is edited as a draft
                case "$(value_of "$item" Status)" in
                  Done|Review|"$target") ;;
                  *) set_option "$item" Status "$target" ;;
                esac
              done
              ;;
          esac

      # Runs after the card has moved, so a Hito whose last issue was just closed is complete
      - name: Post a status update when a Hito is complete
        if: github.event_name == 'issues' && github.event.action == 'closed'
        env:
          GH_TOKEN: ${{ secrets.project_token }}
          OWNER: ${{ inputs.project_owner }}
          NUMBER: ${{ inputs.project_number }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          STATE_REASON: ${{ github.event.issue.state_reason }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/gh-api.sh"

          if [ -z "$GH_TOKEN" ]; then
            exit 0
          fi

          # The closed issue's Hito and the updates already posted, before going through every card
          meta=$(api graphql -f query='
            query($owner: String!, $number: Int!, $issue: ID!) {
              user(login: $owner) { projectV2(number: $number) { id statusUpdates(first: 100) { nodes { body } } } }
              node(id: $issue) {
                ... on Issue {
                  projectItems(first: 50) {
                    nodes {
                      project { id }
                      hito: fieldValueByName(name: "Hito") { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -F number="$NUMBER" -f issue="$ISSUE_ID")
          PROJECT_ID=$(jq -r '.data.user.projectV2.id' <<<"$meta")
          hito=$(jq -r --arg project "$PROJECT_ID" \
            '[.data.node.projectItems.nodes[] | select(.project.id == $project) | .hito.name // empty] | first // ""' <<<"$meta")
          if [ -z "$hito" ]; then
            echo "The issue has no Hito"
            exit 0
          fi
          heading="**Hito cerrado: $hito**"
          posted=$(jq --arg h "$heading" '[.data.user.projectV2.statusUpdates.nodes[].body | select(startswith($h))] | length' <<<"$meta")
          if [ "$posted" != "0" ]; then
            echo "«$hito» already has its status update"
            exit 0
          fi

          # Pages go to a file: the whole project no longer fits in a command-line argument
          pages=$(mktemp)
          page=$(mktemp)
          cursor=''
          while :; do
            api graphql -f query='
              query($owner: String!, $number: Int!, $after: String) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    items(first: 100, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        hito: fieldValueByName(name: "Hito") { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                        module: fieldValueByName(name: "Módulo") { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                        start: fieldValueByName(name: "Inicio") { ... on ProjectV2ItemFieldDateValue { date } }
                        target: fieldValueByName(name: "Objetivo") { ... on ProjectV2ItemFieldDateValue { date } }
                        content { ... on Issue { title number url state stateReason repository { name } } }
                      }
                    }
                  }
                }
              }' -f owner="$OWNER" -F number="$NUMBER" ${cursor:+-f after="$cursor"} >"$page"
            cat "$page" >>"$pages"
            [ "$(jq -r '.data.user.projectV2.items.pageInfo.hasNextPage' "$page")" = "true" ] || break
            cursor=$(jq -r '.data.user.projectV2.items.pageInfo.endCursor' "$page")
          done

          # Issues only, with the closed issue taken as closed even if the API still lags behind the event
          cards=$(jq -cs --arg url "$ISSUE_URL" --arg reason "$(tr '[:lower:]' '[:upper:]' <<<"$STATE_REASON")" '
            map(.data.user.projectV2.items.nodes[]) | map(select(.content.url != null) | {
              hito: .hito.name, module: (.module.name // .content.repository.name), start: .start.date, target: .target.date,
              title: .content.title, number: .content.number, url: .content.url, state: .content.state, reason: .content.stateReason
            } | if .url == $url then .state = "CLOSED" | .reason = $reason else . end)' "$pages")

          open=$(jq --arg h "$hito" 'map(select(.hito == $h and .state != "CLOSED")) | length' <<<"$cards")
          if [ "$open" != "0" ]; then
            echo "«$hito» still has $open open cards"
            exit 0
          fi

          today=$(date -u +%F)
          update=$(jq -r --arg h "$hito" --arg heading "$heading" --arg today "$today" '
            def es: split("-") as [$y, $m, $d]
              | "\($d | tonumber) \(["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][($m | tonumber) - 1]) \($y)";
            def day: . + "T00:00:00Z" | fromdateiso8601 / 86400;
            def plural($n; $one; $many): if $n == 1 then "1 \($one)" else "\($n) \($many)" end;
            def list: map("- [\(.module) #\(.number)](\(.url)) \(.title)") | join("\n");
            map(select(.hito == $h)) as $done
            | ($done | map(.target // empty) | max) as $target
            | ($done | map(select(.reason == "COMPLETED"))) as $completed
            | ($done | map(select(.reason != "COMPLETED"))) as $dropped
            | (map(select(.hito != $h and .state != "CLOSED")) | group_by(.hito)
                | map({hito: .[0].hito, start: (map(.start // empty) | min), target: (map(.target // empty) | max), open: length})
                | map(select(.start != null and .hito != null)) | sort_by(.start) | first) as $next
            | (if $target == null or $today <= $target then "ON_TRACK" else "AT_RISK" end) as $status
            | {
                status: $status,
                start: (map(.start // empty) | min),
                target: (map(.target // empty) | max),
                body: ([
                  $heading,
                  (if $target == null then "Cerrado el \($today | es)."
                   elif $status == "ON_TRACK" then "Cerrado el \($today | es); objetivo: \($target | es)."
                   else "Cerrado el \($today | es), \(plural(($today | day) - ($target | day); "día"; "días")) después del objetivo (\($target | es))." end),
                  (if ($completed | length) > 0 then "Hechas (\($completed | length)):\n\($completed | list)" else empty end),
                  (if ($dropped | length) > 0 then "Descartadas (\($dropped | length)):\n\($dropped | list)" else empty end),
                  (if $next != null
                   then "**Siguiente**: \($next.hito), del \($next.start | es) al \($next.target | es), con \(plural($next.open; "tarjeta abierta"; "tarjetas abiertas"))."
                   else empty end)
                ] | join("\n\n"))
              }' <<<"$cards")

          # The project's span (first Inicio to last Objetivo), so the latest update keeps showing it
          dates=()
          for date in start target; do
            value=$(jq -r --arg d "$date" '.[$d] // ""' <<<"$update")
            if [ -n "$value" ]; then
              dates+=(-f "$date=$value")
            fi
          done
          api graphql -f query='
            mutation($project: ID!, $body: String!, $status: ProjectV2StatusUpdateStatus!, $start: Date, $target: Date) {
              createProjectV2StatusUpdate(input: {
                projectId: $project, body: $body, status: $status, startDate: $start, targetDate: $target
              }) { statusUpdate { id } }
            }' -f project="$PROJECT_ID" -f body="$(jq -r .body <<<"$update")" -f status="$(jq -r .status <<<"$update")" \
            "${dates[@]}" >/dev/null
          echo "Status update posted for «$hito»"
