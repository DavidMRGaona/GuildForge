name: Reusable module tests

# Runs a module's PHPUnit suite inside the host application and, with quality: true, the
# core's quality tools on it (src/scripts/check-module-quality.sh, also behind
# `make check MODULE=<name>`). Called by each module's tests.yml on every pull request and
# by reusable-module-release.yml before a release. A pull request that only bumps the version
# in module.json skips both (gate job), since the tag runs the tests before publishing.
# The suite runs in TEST_PARTS parts on as many machines (part job); the required check
# test / Test module is the job that passes only when all of them pass.

on:
  workflow_call:
    inputs:
      module_name:
        description: 'Module name (kebab-case)'
        required: true
        type: string
      php_version:
        description: 'PHP version'
        required: false
        type: string
        default: '8.5'
      host_ref:
        description: 'Ref of DavidMRGaona/GuildForge to test against (branch, tag or SHA)'
        required: false
        type: string
        default: 'main'
      quality:
        description: "Also run the core's quality tools on the module (Rector, Pint, PHPStan, ESLint, Prettier, vue-tsc, Vitest); each module turns it on once its code passes them"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Parts a module's suite is split into, one machine each (part job); the host job turns it into
  # the matrix
  TEST_PARTS: 4

jobs:
  # A release pull request only bumps the version in module.json, and the tag runs the tests
  # again before anything is published, so its run is skipped. Anything else, an error
  # included, runs it all
  gate:
    name: Gate
    runs-on: ubuntu-latest

    outputs:
      skip: ${{ steps.decide.outputs.skip }}

    steps:
      - name: Checkout module
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      # Only the literal skip=true skips the jobs below; continue-on-error keeps a failure here
      # from failing the run, and they still run because the output is missing then
      - name: Decide whether the tests have to run
        id: decide
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # The runner sets -e, which would end the script at the first check that says "run the
          # tests"; every error is handled where it happens instead
          set +e -uo pipefail

          reason=""
          if [ "${EVENT}" != "pull_request" ]; then
            reason="event ${EVENT}"
          elif [ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ] || ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            reason="HEAD is not the merge commit of the pull request"
          elif ! files="$(git diff --name-only 'HEAD^1' HEAD)"; then
            reason="could not diff against the base"
          elif [ "${files}" != "module.json" ]; then
            reason="the pull request changes more than module.json"
          elif ! before="$(git show 'HEAD^1:module.json' | jq -S 'del(.version)')" \
            || ! after="$(git show 'HEAD:module.json' | jq -S 'del(.version)')"; then
            reason="could not read module.json"
          elif [ "${before}" != "${after}" ]; then
            reason="module.json changes more than its version"
          fi

          if [ -z "${reason}" ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Tests skipped: only the version in module.json changes; the tag runs them before publishing" | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            echo "Tests run: ${reason}" | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

  # The host commit every part tests against, resolved once: host_ref may be a branch that moves
  # while the parts start, and parts on different commits could split the suite differently. It
  # also tells whether that commit splits the suite: a host_ref older than the split (core#355)
  # has neither phpunit-part.php for modules nor run-module-tests.sh with <part> <parts>, so the
  # suite then runs whole in a single job
  host:
    name: Host
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      split: ${{ steps.resolve.outputs.split }}
      parts: ${{ steps.resolve.outputs.parts }}
      count: ${{ steps.resolve.outputs.count }}

    steps:
      - name: Checkout host scripts
        uses: actions/checkout@v7
        with:
          repository: DavidMRGaona/GuildForge
          ref: ${{ inputs.host_ref }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Resolve the host commit and how the suite runs
        id: resolve
        run: |
          sha="$(git rev-parse HEAD)"
          if [ -f .github/scripts/phpunit-part.php ] \
            && grep -qF 'run-module-tests.sh <module-name> [<part> <parts>]' .github/scripts/run-module-tests.sh; then
            split=true
            parts="$(jq -cn --argjson n "${TEST_PARTS}" '[range(1; $n + 1)]')"
            count="${TEST_PARTS}"
            echo "Host ${sha}: the suite runs in ${TEST_PARTS} parts" | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            split=false
            parts='[1]'
            count=1
            echo "::notice::Host ${sha} does not split module suites: it runs whole in one job"
            echo "Host ${sha}: the suite runs whole in one job, as this host_ref does not split it" >> "${GITHUB_STEP_SUMMARY}"
          fi
          {
            echo "sha=${sha}"
            echo "split=${split}"
            echo "parts=${parts}"
            echo "count=${count}"
          } >> "${GITHUB_OUTPUT}"

  # The suite in TEST_PARTS parts on as many machines, each part with one process per core
  part:
    name: ${{ needs.host.outputs.split == 'true' && format('Tests (part {0} of {1})', matrix.part, needs.host.outputs.count) || 'Tests (whole suite)' }}
    needs: [gate, host]
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' && needs.host.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    strategy:
      # Every part runs to the end, so one run shows every failure
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.host.outputs.parts) }}

    # The sites run on PostgreSQL, so the suite does too, as the core's: SQLite stores dates
    # as text and takes any value in a UUID column, which hides failures. Cache, queue and
    # session stay as the module's phpunit.xml sets them (array and sync), so no Redis
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: guildforge
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: guildforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U guildforge -d guildforge_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # A part missing from the matrix would leave its tests unrun without failing anything
      - name: Check the matrix against the parts
        working-directory: .
        env:
          JOBS: ${{ strategy.job-total }}
          COUNT: ${{ needs.host.outputs.count }}
        run: |
          if [ "${JOBS}" -ne "${COUNT}" ]; then
            echo "::error::The matrix has ${JOBS} jobs, but the suite runs in ${COUNT}"
            exit 1
          fi

      - name: Checkout host application
        uses: actions/checkout@v7
        with:
          repository: DavidMRGaona/GuildForge
          ref: ${{ needs.host.outputs.sha }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: pdo_pgsql, pdo_sqlite, redis, gd, zip, bcmath, intl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ inputs.php_version }}-composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ inputs.php_version }}-composer-

      - name: Install host dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # The core's QR code renderer runs it for SVG logos in PNG codes. Most module suites
      # never draw one, so a runner that cannot install it only warns: a test that does
      # draw one then fails on its own, naming rsvg-convert (#531)
      - uses: ./.github/actions/svg-rasterizer
        with:
          required: 'false'

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: guildforge_test
          DB_USERNAME: guildforge
          DB_PASSWORD: secret

      # Checked out after the host is installed: Composer scripts, key:generate and the
      # migrations boot the application without any module, exactly as in the host CI
      - name: Checkout module
        uses: actions/checkout@v7
        with:
          path: src/modules/${{ inputs.module_name }}
          # The pull request's code runs here: leave no token behind in .git/config
          persist-credentials: false

      # Real variables win over the sqlite/:memory: of the module's phpunit.xml, which
      # keeps them as the default for running the suite locally
      - name: Run module tests
        env:
          MODULE_NAME: ${{ inputs.module_name }}
          SPLIT: ${{ needs.host.outputs.split }}
          PART: ${{ matrix.part }}
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: guildforge_test
          DB_USERNAME: guildforge
          DB_PASSWORD: secret
        run: |
          if [ "${SPLIT}" = true ]; then
            sh ../.github/scripts/run-module-tests.sh "$MODULE_NAME" "$PART" "$TEST_PARTS"
          else
            sh ../.github/scripts/run-module-tests.sh "$MODULE_NAME"
          fi

  # The required check, test / Test module: passes only when every part of the suite passed.
  # always() so a cancelled or failed part fails it instead of skipping it, since the ruleset
  # counts a skipped check as passed; it is skipped only when the gate skips the tests, as every
  # other job then is
  test:
    name: Test module
    needs: [gate, host, part]
    if: ${{ always() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check the parts of the suite
        env:
          HOST: ${{ needs.host.result }}
          PART: ${{ needs.part.result }}
        run: |
          echo "host: ${HOST}, parts: ${PART}"
          if [ "${HOST}" != "success" ] || [ "${PART}" != "success" ]; then
            echo "::error::A part of the suite did not pass"
            exit 1
          fi

  quality:
    name: Quality
    needs: gate
    if: ${{ inputs.quality && !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout host application
        uses: actions/checkout@v7
        with:
          repository: DavidMRGaona/GuildForge
          ref: ${{ inputs.host_ref }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: pdo_pgsql, pdo_sqlite, redis, gd, zip, bcmath, intl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ inputs.php_version }}-composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ inputs.php_version }}-composer-

      - name: Install host dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Read the Node version
        id: node
        run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

      # Inline rather than the core's .github/actions: host_ref may name a release without them.
      # Exact key, no fallback: the tree npm ci installs depends only on package-lock.json and on
      # the platform and Node it runs on, so a hit is what npm ci would install
      - name: Restore host node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: src/node_modules
          key: host-node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.version }}-${{ hashFiles('src/package-lock.json') }}

      - name: Install host npm dependencies
        if: ${{ steps.node-modules.outputs.cache-hit != 'true' }}
        run: npm ci

      # Right after npm ci, before the module is checked out and anything else lands in node_modules
      - name: Save host node_modules
        if: ${{ steps.node-modules.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: src/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      # After the host is installed, as in the test job: the tools run with the core's
      # configuration from host_ref, and the module copies none of it
      - name: Checkout module
        uses: actions/checkout@v7
        with:
          path: src/modules/${{ inputs.module_name }}
          persist-credentials: false

      - name: Run quality checks
        env:
          MODULE_NAME: ${{ inputs.module_name }}
        run: sh scripts/check-module-quality.sh all "$MODULE_NAME"
