name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Skips the suite only when it would repeat a result already obtained: a push to main whose
  # tree is the one its pull request's CI tested, or a pull request that only changes
  # src/VERSION on top of a main that passed CI. Anything else, an error included, runs it all.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read

    outputs:
      reuse: ${{ steps.decide.outputs.reuse }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      # Only the literal reuse=true skips the suite; continue-on-error keeps a failure here from
      # failing the run, and the jobs below still run because the output is missing then
      - name: Decide whether the suite has to run
        id: decide
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          # The runner sets -e, which would end the script at the first check that says "run the
          # suite"; every error is handled where it happens instead
          set +e -uo pipefail

          reason=""
          reused=""

          # The pull request merged as this commit, and a successful CI run of it that tested
          # this same tree (its merge commit, recorded in the ci-tested-tree artifact)
          reuse_pull_request_result() {
            local pr number head runs run_id run_url artifact_id dir tested
            pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq "
              map(select(.merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"${GITHUB_SHA}\"))
              | if length == 1 then .[0] | \"\(.number) \(.head.sha)\" else empty end")" \
              || { reason="could not list the pull requests of ${GITHUB_SHA}"; return 1; }
            if [ -z "${pr}" ]; then
              reason="no single pull request was merged as ${GITHUB_SHA}"
              return 1
            fi
            read -r number head <<< "${pr}"

            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=pull_request&head_sha=${head}&status=success&per_page=20" \
              --jq '.workflow_runs[] | "\(.id) \(.html_url)"')" \
              || { reason="could not list the CI runs of pull request #${number}"; return 1; }
            if [ -z "${runs}" ]; then
              reason="pull request #${number} has no successful CI run for ${head}"
              return 1
            fi

            # Every attempt of a run tests the same commit, so the newest record of the run will do
            while read -r run_id run_url; do
              artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?name=ci-tested-tree" \
                --jq '[.artifacts[] | select(.expired | not)] | if length > 0 then max_by(.created_at).id else empty end' < /dev/null)" || continue
              [ -n "${artifact_id}" ] || continue
              dir="$(mktemp -d)"
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${dir}/artifact.zip" < /dev/null || continue
              unzip -q "${dir}/artifact.zip" -d "${dir}" || continue
              tested="$(sed -n 's/^tree=//p' "${dir}/tested-tree" 2> /dev/null)"
              if [ -n "${tested}" ] && [ "${tested}" = "${tree}" ]; then
                reused="run ${run_url} of pull request #${number} tested tree ${tree}"
                return 0
              fi
            done <<< "${runs}"

            reason="no successful CI run of pull request #${number} tested tree ${tree} (main moved after it ran, or its record expired)"
            return 1
          }

          # A release: only src/VERSION changes, on top of a base whose CI on main passed
          version_only_on_tested_base() {
            local base files count
            if ! base="$(git rev-parse --verify 'HEAD^1')" || ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
              reason="HEAD is not the merge commit of the pull request"
              return 1
            fi
            files="$(git diff --name-only "${base}" HEAD)" \
              || { reason="could not diff against the base ${base}"; return 1; }
            if [ "${files}" != "src/VERSION" ]; then
              reason="the pull request changes more than src/VERSION"
              return 1
            fi
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=${base}&status=success" \
              --jq '.total_count')" \
              || { reason="could not list the CI runs of the base ${base}"; return 1; }
            if ! [[ "${count}" =~ ^[0-9]+$ ]] || [ "${count}" -eq 0 ]; then
              reason="only src/VERSION changes, but CI on main has not passed (yet) for the base ${base}"
              return 1
            fi
            reused="only src/VERSION changes, on top of ${base}, whose CI on main passed"
            return 0
          }

          if ! tree="$(git rev-parse --verify 'HEAD^{tree}')" || [ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]; then
            reason="could not read the tree of ${GITHUB_SHA}"
          elif [ "${EVENT}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            reuse_pull_request_result
          elif [ "${EVENT}" = "pull_request" ]; then
            version_only_on_tested_base
          else
            reason="event ${EVENT} on ${GITHUB_REF}"
          fi

          if [ "${EVENT}" = "pull_request" ] && [ -n "${tree:-}" ]; then
            mode="full"
            if [ -n "${reused}" ]; then mode="version-only"; fi
            printf 'tree=%s\nmerge_sha=%s\nmode=%s\n' "${tree}" "${GITHUB_SHA}" "${mode}" > "${RUNNER_TEMP}/tested-tree"
          fi

          if [ -n "${reused}" ]; then
            echo "reuse=true" >> "${GITHUB_OUTPUT}"
            echo "Suite skipped: ${reused}" | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "reuse=false" >> "${GITHUB_OUTPUT}"
            echo "Full suite: ${reason}" | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

      # The tree this run tests, so the push to main after merging can tell whether it is the same
      - name: Record the tested tree
        if: ${{ github.event_name == 'pull_request' && steps.decide.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-tested-tree
          path: ${{ runner.temp }}/tested-tree
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  test:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: guildforge
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: guildforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U guildforge"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, gd, zip, bcmath, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      # Before Pint: Rector's output is not Pint-clean, so the order is Rector → Pint → PHPStan
      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: PHP code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Verify module import map entries
        run: npm run verify:build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: guildforge_test
          DB_USERNAME: guildforge
          DB_PASSWORD: secret

      # One process per core; Laravel creates a database per process (guildforge_test_test_1…),
      # which the service's POSTGRES_USER may do as the image makes it a superuser
      - name: Run tests
        run: php artisan test --parallel
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: guildforge_test
          DB_USERNAME: guildforge
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  test-madrid:
    name: test (Madrid storage)
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: guildforge
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: guildforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U guildforge"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, gd, zip, bcmath, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      # The regular job stores in UTC, as fresh installs do; this one runs the same suite with
      # instants stored in Europe/Madrid (sites not converted yet, and --reverse), in its own job
      # so it runs in parallel with the regular one
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Verify module import map entries
        run: npm run verify:build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: guildforge_test
          DB_USERNAME: guildforge
          DB_PASSWORD: secret

      # One process per core; Laravel creates a database per process (guildforge_test_test_1…),
      # which the service's POSTGRES_USER may do as the image makes it a superuser
      - name: Run tests
        run: php artisan test --parallel
        env:
          APP_STORAGE_TIMEZONE_DEFAULT: Europe/Madrid
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: guildforge_test
          DB_USERNAME: guildforge
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  lint:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v7

      # Pinned release checked against its sha256; shellcheck comes with the runner image and
      # actionlint skips the run: scripts silently without it, hence the explicit check
      - name: Lint workflows
        working-directory: .
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          command -v shellcheck > /dev/null || { echo "::error::shellcheck is not installed"; exit 1; }
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$ARCHIVE" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run type-check

      - name: Public API report
        run: npm run check:public-api

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Vitest
        run: npm run test:unit
