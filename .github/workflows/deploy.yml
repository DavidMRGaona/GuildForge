name: Deploy

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_canary:
        description: Emergency only - deploy every target at once, without waiting for the canary
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # One deploy URL per line; add a line here for each new target.
  WEBHOOKS: |
    ${{ secrets.WEBHOOK_URL_SERVER_1 }}
    ${{ secrets.WEBHOOK_URL_SERVER_2 }}
  DEPLOY_API_TOKEN: ${{ secrets.DEPLOY_API_TOKEN }}
  # The commit that passed CI; the targets deploy the head of main, so it must still be the head.
  EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  GH_TOKEN: ${{ github.token }}

jobs:
  canary:
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.skip_canary)
      }}
    timeout-minutes: 30

    outputs:
      index: ${{ steps.select.outputs.index }}
      superseded: ${{ steps.head.outputs.superseded }}

    env:
      CANARY_RESOURCE_UUID: ${{ vars.CANARY_RESOURCE_UUID }}
      CANARY_HEALTH_URL: ${{ vars.CANARY_HEALTH_URL }}
      STATUS_POLL_SECONDS: 10
      STATUS_TIMEOUT_SECONDS: 1200
      HEALTH_POLL_SECONDS: 6
      HEALTH_TIMEOUT_SECONDS: 300
      HEALTH_REQUIRED_STREAK: 5

    steps:
      - name: Check that main is still the commit that passed CI
        id: head
        run: |
          set -euo pipefail

          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${head}" != "${EXPECTED_SHA}" ]; then
            echo "::notice::main moved from ${EXPECTED_SHA} to ${head}; nothing is deployed here, the run for the newer commit deploys it once its CI passes."
            echo "superseded=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Deploying ${EXPECTED_SHA}"
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Select the canary target
        id: select
        if: ${{ steps.head.outputs.superseded != 'true' }}
        run: |
          set -euo pipefail
          mask_url() {
            echo "::add-mask::$1"
            local host base
            host="$(printf '%s' "$1" | sed -nE 's#^https?://([^/?#:]+).*#\1#p')"
            base="$(printf '%s' "$1" | sed -nE 's#^(https?://[^/?#]+).*#\1#p')"
            if [ -n "${host}" ]; then echo "::add-mask::${host}"; fi
            if [ -n "${base}" ]; then echo "::add-mask::${base}"; fi
          }

          if [ -z "${CANARY_RESOURCE_UUID}" ] || [ -z "${CANARY_HEALTH_URL}" ]; then
            echo "::error::Set the CANARY_RESOURCE_UUID and CANARY_HEALTH_URL repository variables (or run with skip_canary)."
            exit 1
          fi
          echo "::add-mask::${CANARY_RESOURCE_UUID}"
          echo "::add-mask::${CANARY_HEALTH_URL}"

          mapfile -t webhooks < <(printf '%s' "${WEBHOOKS}")
          matches=()
          for i in "${!webhooks[@]}"; do
            if [ -z "${webhooks[$i]}" ]; then
              echo "::error::Deploy URL #$((i + 1)) is empty; check the deploy URL secrets."
              exit 1
            fi
            mask_url "${webhooks[$i]}"
            uuid="$(printf '%s' "${webhooks[$i]}" | sed -nE 's/.*[?&]uuid=([^&#]*).*/\1/p')"
            if [ "${uuid}" = "${CANARY_RESOURCE_UUID}" ]; then
              matches+=("${i}")
            fi
          done

          if [ "${#matches[@]}" -ne 1 ]; then
            echo "::error::CANARY_RESOURCE_UUID must match exactly one deploy URL (matched ${#matches[@]} of ${#webhooks[@]})."
            exit 1
          fi
          echo "Canary: deploy URL #$((matches[0] + 1)) of ${#webhooks[@]}"
          echo "index=${matches[0]}" >> "${GITHUB_OUTPUT}"

      - name: Deploy the canary
        id: trigger
        if: ${{ steps.head.outputs.superseded != 'true' }}
        env:
          INDEX: ${{ steps.select.outputs.index }}
        run: |
          set -euo pipefail
          mask_url() {
            echo "::add-mask::$1"
            local host base
            host="$(printf '%s' "$1" | sed -nE 's#^https?://([^/?#:]+).*#\1#p')"
            base="$(printf '%s' "$1" | sed -nE 's#^(https?://[^/?#]+).*#\1#p')"
            if [ -n "${host}" ]; then echo "::add-mask::${host}"; fi
            if [ -n "${base}" ]; then echo "::add-mask::${base}"; fi
          }

          mapfile -t webhooks < <(printf '%s' "${WEBHOOKS}")
          webhook="${webhooks[$INDEX]}"
          mask_url "${webhook}"

          if ! response="$(curl -X POST "${webhook}" \
            -H "Authorization: Bearer ${DEPLOY_API_TOKEN}" \
            --fail --silent --show-error --max-time 60)"; then
            echo "::error::The deployment platform rejected the canary deployment."
            exit 1
          fi

          deployment_uuid="$(printf '%s' "${response}" \
            | jq -r '[.deployments[]?.deployment_uuid // empty] | if length == 1 then .[0] else empty end' 2>/dev/null || true)"
          if ! [[ "${deployment_uuid}" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::The deployment platform response has no single valid deployment_uuid."
            exit 1
          fi
          echo "Canary deployment ${deployment_uuid} queued"
          echo "deployment_uuid=${deployment_uuid}" >> "${GITHUB_OUTPUT}"

      - name: Wait for the canary deployment
        if: ${{ steps.head.outputs.superseded != 'true' }}
        env:
          INDEX: ${{ steps.select.outputs.index }}
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          mask_url() {
            echo "::add-mask::$1"
            local host base
            host="$(printf '%s' "$1" | sed -nE 's#^https?://([^/?#:]+).*#\1#p')"
            base="$(printf '%s' "$1" | sed -nE 's#^(https?://[^/?#]+).*#\1#p')"
            if [ -n "${host}" ]; then echo "::add-mask::${host}"; fi
            if [ -n "${base}" ]; then echo "::add-mask::${base}"; fi
          }

          mapfile -t webhooks < <(printf '%s' "${WEBHOOKS}")
          webhook="${webhooks[$INDEX]}"
          mask_url "${webhook}"
          base="$(printf '%s' "${webhook}" | sed -nE 's#^(https?://[^/?#]+).*#\1#p')"
          if [ -z "${base}" ]; then
            echo "::error::Cannot derive the deployment platform URL from the canary deploy URL."
            exit 1
          fi

          body="$(mktemp)"
          deadline=$((SECONDS + STATUS_TIMEOUT_SECONDS))
          last=""
          while true; do
            code="$(curl --silent --max-time 30 -o "${body}" -w '%{http_code}' \
              -H "Authorization: Bearer ${DEPLOY_API_TOKEN}" \
              "${base}/api/v1/deployments/${DEPLOYMENT_UUID}")" || code="000"

            case "${code}" in
              200)
                status="$(jq -r '.status // empty' "${body}" 2>/dev/null || true)"
                if [ "${status}" != "${last}" ]; then
                  echo "Canary deployment status: ${status:-unknown}"
                  last="${status}"
                fi
                case "${status}" in
                  finished)
                    commit="$(jq -r '.commit // "unknown"' "${body}")"
                    if [ "${commit}" != "${EXPECTED_SHA}" ]; then
                      echo "::error::The canary deployed ${commit}, not ${EXPECTED_SHA} (the commit that passed CI); the other targets were not deployed."
                      exit 1
                    fi
                    echo "Canary deployed ${commit}"
                    exit 0
                    ;;
                  failed | cancelled*)
                    echo "::error::Canary deployment ended as '${status}'; the other targets were not deployed."
                    exit 1
                    ;;
                esac
                ;;
              401 | 403)
                echo "::error::HTTP ${code} reading the deployment status: DEPLOY_API_TOKEN needs permission to read deployments."
                exit 1
                ;;
              *)
                echo "::warning::HTTP ${code} reading the deployment status; retrying."
                ;;
            esac

            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::The canary deployment did not finish within ${STATUS_TIMEOUT_SECONDS}s (last status: ${last:-unknown})."
              exit 1
            fi
            sleep "${STATUS_POLL_SECONDS}"
          done

      - name: Check the canary health
        if: ${{ steps.head.outputs.superseded != 'true' }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + HEALTH_TIMEOUT_SECONDS))
          streak=0
          while true; do
            code="$(curl --silent --max-time 10 -o /dev/null -w '%{http_code}' "${CANARY_HEALTH_URL}")" || code="000"
            if [ "${code}" = "200" ]; then
              streak=$((streak + 1))
            else
              streak=0
            fi
            echo "Health check: HTTP ${code} (${streak}/${HEALTH_REQUIRED_STREAK})"

            if [ "${streak}" -ge "${HEALTH_REQUIRED_STREAK}" ]; then
              echo "Canary is healthy"
              exit 0
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::The canary was not healthy ${HEALTH_REQUIRED_STREAK} times in a row within ${HEALTH_TIMEOUT_SECONDS}s; the other targets were not deployed."
              exit 1
            fi
            sleep "${HEALTH_POLL_SECONDS}"
          done

  rollout:
    runs-on: ubuntu-latest
    needs: canary
    if: >-
      ${{
        !failure() && !cancelled() && needs.canary.outputs.superseded != 'true' && (
          needs.canary.result == 'success' ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.skip_canary)
        )
      }}

    steps:
      - name: Deploy the remaining targets
        env:
          SKIP_CANARY: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_canary }}
          CANARY_INDEX: ${{ needs.canary.outputs.index }}
        run: |
          set -euo pipefail
          mask_url() {
            echo "::add-mask::$1"
            local host base
            host="$(printf '%s' "$1" | sed -nE 's#^https?://([^/?#:]+).*#\1#p')"
            base="$(printf '%s' "$1" | sed -nE 's#^(https?://[^/?#]+).*#\1#p')"
            if [ -n "${host}" ]; then echo "::add-mask::${host}"; fi
            if [ -n "${base}" ]; then echo "::add-mask::${base}"; fi
          }

          mapfile -t webhooks < <(printf '%s' "${WEBHOOKS}")
          if [ "${SKIP_CANARY}" = "true" ]; then
            echo "::warning::Canary skipped: deploying every target at once."
          elif [ -z "${CANARY_INDEX}" ]; then
            echo "::error::The canary job did not report which target it deployed."
            exit 1
          else
            head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            if [ "${head}" != "${EXPECTED_SHA}" ]; then
              echo "::warning::main moved from ${EXPECTED_SHA} to ${head} during the canary; the other targets were not deployed, the run for the newer commit deploys them."
              exit 0
            fi
          fi

          deployed=0
          failed=0
          for i in "${!webhooks[@]}"; do
            if [ "${SKIP_CANARY}" != "true" ] && [ "${i}" = "${CANARY_INDEX}" ]; then
              continue
            fi
            if [ -z "${webhooks[$i]}" ]; then
              echo "::error::Deploy URL #$((i + 1)) is empty; check the deploy URL secrets."
              failed=$((failed + 1))
              continue
            fi
            mask_url "${webhooks[$i]}"
            echo "Deploying target #$((i + 1))"
            if curl -X POST "${webhooks[$i]}" \
              -H "Authorization: Bearer ${DEPLOY_API_TOKEN}" \
              --fail --silent --show-error --max-time 60 -o /dev/null; then
              deployed=$((deployed + 1))
            else
              echo "::error::Deploying target #$((i + 1)) failed."
              failed=$((failed + 1))
            fi
          done

          echo "Triggered ${deployed} deployment(s), ${failed} failed"
          [ "${failed}" -eq 0 ]
