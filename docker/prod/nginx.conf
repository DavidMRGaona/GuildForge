server {
    listen 8000;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Allow larger file uploads (20MB)
    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire assets are served via PHP route, not static files
    location ^~ /livewire {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Module assets - served from public/build/modules/ (built by Vite)
    location ^~ /build/modules/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Manifests keep their URL across module updates while the chunks they
        # list are renamed: they must be revalidated, never cached as immutable
        location ~ /manifest\.json$ {
            try_files $uri =404;
            expires off;
            add_header Cache-Control "no-cache";
            access_log off;
        }
    }

    # Real-time WebSocket (core#493): the Reverb process of this container, started only when
    # the site turns real time on; otherwise this answers 502 and the pages keep polling.
    # Reverb's publishing API (/apps/…) stays unexposed: the application reaches it on 127.0.0.1.
    # The read timeout stays above Reverb's ping interval (60 s), or idle sockets are cut
    location ^~ /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Static assets with cache headers (return 404 if missing, don't route through Laravel)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Deny access to hidden files (allow .well-known for SSL/ACME)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
